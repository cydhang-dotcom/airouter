server:
  port: 8081

spring:
  application:
    name: ai-service
  main:
    banner-mode: "off"
  ai:
    openai:
      # OpenAI兼容默认配置（支持系统属性/环境变量，多重回退）。
      api-key: ${OPENAI_COMPAT_API_KEY:${openai.api.key:}}
      base-url: ${OPENAI_BASE_URL:${openai.base.url:https://api.moonshot.cn}}

ai:
  # 路由：alias:model。alias 对应 providers.clients 下的别名，可自由增加多个 Kimi/GLM/Qwen 账号或环境。
  default-model: kimi-main:moonshot-v1-8k
  routes:
    CONTRACT_SUMMARY: kimi-main:moonshot-v1-8k
    CUSTOMER_FOLLOWUP: glm-main:glm-4
  # 可选：主备链（优先级从前到后），当首选失败自动切换
  chains:
    CUSTOMER_FOLLOWUP:
      - glm-main:glm-4
      - kimi-main:moonshot-v1-8k

  policy:
    default-policy:
      allowFallback: true
      timeoutMs: 30000
      perRouteMaxAttempts: 1
    scenes:
      CONTRACT_SUMMARY:
        timeoutMs: 45000
      CUSTOMER_FOLLOWUP:
        timeoutMs: 20000
    tenants:
      t001:
        defaultPolicy:
          timeoutMs: 25000
        scenes:
          CUSTOMER_FOLLOWUP:
            timeoutMs: 15000

providers:
  clients:
    kimi-main:
      base-url: ${OPENAI_KIMI_BASE_URL:${OPENAI_BASE_URL:${openai.base.url:https://api.moonshot.cn}}}
      api-key: ${OPENAI_KIMI_API_KEY:${OPENAI_COMPAT_API_KEY:${openai.api.key:}}}
    kimi-256k:
      base-url: ${OPENAI_KIMI_BASE_URL:${OPENAI_BASE_URL:${openai.base.url:https://api.moonshot.cn}}}
      api-key: ${OPENAI_KIMI_API_KEY:${OPENAI_COMPAT_API_KEY:${openai.api.key:}}}
    glm-main:
      base-url: ${OPENAI_GLM_BASE_URL:${openai.glm.base.url:https://open.bigmodel.cn/api/paas}}
      api-key: ${OPENAI_GLM_API_KEY:${openai.glm.api.key:}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

resilience4j:
  timelimiter:
    instances:
      ai:
        timeoutDuration: 30s
  retry:
    instances:
      ai:
        maxAttempts: 2
        waitDuration: 200ms
  circuitbreaker:
    instances:
      ai:
        slidingWindowSize: 20
        failureRateThreshold: 50

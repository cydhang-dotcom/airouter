server:
  port: 8081

spring:
  application:
    name: ai-service
  main:
    banner-mode: "off"
  ai:
    openai:
      # OpenAI兼容默认配置（支持系统属性/环境变量，多重回退）。
      api-key: ${OPENAI_COMPAT_API_KEY:${openai.api.key:}}
      base-url: ${OPENAI_BASE_URL:${openai.base.url:https://api.moonshot.cn}}

ai:
  # 推荐优先使用 chains 配置主备链；routes 保留作为兼容的主路由简写。
  # 路由格式：alias:model。alias 对应 providers.clients 下的别名。
  default-model: kimi-main:moonshot-v1-8k
  routes:
    CONTRACT_SUMMARY: kimi-main:moonshot-v1-8k
    CUSTOMER_FOLLOWUP: glm-main:glm-4
  # 推荐配置：主备链（优先级从前到后），当首选失败自动切换。
  chains:
    CONTRACT_SUMMARY:
      - kimi-main:moonshot-v1-8k
    CUSTOMER_FOLLOWUP:
      - glm-main:glm-4
      - kimi-main:moonshot-v1-8k

  policy:
    default-policy:
      allow-fallback: true
      timeout-ms: 30000
      per-route-max-attempts: 1
    scenes:
      CONTRACT_SUMMARY:
        timeout-ms: 45000
      CUSTOMER_FOLLOWUP:
        timeout-ms: 20000
    tenants:
      t001:
        default-policy:
          timeout-ms: 25000
        scenes:
          CUSTOMER_FOLLOWUP:
            timeout-ms: 15000

  guard:
    enabled: true
    default-requests-per-minute: 120

providers:
  clients:
    kimi-main:
      type: openai-compat
      base-url: ${OPENAI_KIMI_BASE_URL:${OPENAI_BASE_URL:${openai.base.url:https://api.moonshot.cn}}}
      api-key: ${OPENAI_KIMI_API_KEY:${OPENAI_COMPAT_API_KEY:${openai.api.key:}}}
    kimi-256k:
      type: openai-compat
      base-url: ${OPENAI_KIMI_BASE_URL:${OPENAI_BASE_URL:${openai.base.url:https://api.moonshot.cn}}}
      api-key: ${OPENAI_KIMI_API_KEY:${OPENAI_COMPAT_API_KEY:${openai.api.key:}}}
    glm-main:
      type: openai-compat
      base-url: ${OPENAI_GLM_BASE_URL:${openai.glm.base.url:https://open.bigmodel.cn/api/paas}}
      api-key: ${OPENAI_GLM_API_KEY:${openai.glm.api.key:}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

resilience4j:
  timelimiter:
    instances:
      ai:
        timeoutDuration: 30s
  retry:
    instances:
      ai:
        maxAttempts: 2
        waitDuration: 200ms
  circuitbreaker:
    instances:
      ai:
        slidingWindowSize: 20
        failureRateThreshold: 50
